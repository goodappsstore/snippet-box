[package]
name = "snippets-manager"
version = "0.1.1"
description = "Modern text and markdown snippet manager with hybrid vector search"
authors = ["Snippets Manager"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "snippets_manager_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sqlite-vec = "=0.1.9"
ort = "2.0.0-rc.13"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
regex = "1"
stop-words = { version = "0.10", default-features = false, features = ["nltk"] }

